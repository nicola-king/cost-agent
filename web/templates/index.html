<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost Agent v6.0 - 统一造价平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            color: #eee;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .search-box {
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 5px;
            background: #0f3460;
            color: #fff;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .search-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 5px;
            background: #e94560;
            color: #fff;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-btn:hover {
            background: #ff6b6b;
        }

        .results {
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
            min-height: 300px;
        }

        .result-item {
            background: #0f3460;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .result-title {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #e94560;
        }

        .result-content {
            opacity: 0.8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #e94560;
        }

        .stat-label {
            opacity: 0.7;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background: #16213e;
            border: none;
            border-radius: 5px;
            color: #eee;
            cursor: pointer;
            transition: background 0.3s;
        }

        .tab.active {
            background: #e94560;
        }

        .loading {
            text-align: center;
            padding: 40px;
            opacity: 0.7;
        }

        .error {
            background: #ff6b6b;
            color: #fff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏗️ Cost Agent v6.0</h1>
            <p class="subtitle">统一造价平台 - 造价计算 + 定额匹配 + 知识图谱 + 自进化</p>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="stat-nodes">-</div>
                <div class="stat-label">图谱节点</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-edges">-</div>
                <div class="stat-label">图谱边</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-files">-</div>
                <div class="stat-label">跟踪文件</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-generation">-</div>
                <div class="stat-label">进化代数</div>
            </div>
        </div>

        <div class="search-box">
            <input type="text" class="search-input" id="search-input" placeholder="输入查询内容...">
            <button class="search-btn" onclick="search()">🔍 查询</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('query')">综合查询</button>
            <button class="tab" onclick="switchTab('search')">关键词搜索</button>
            <button class="tab" onclick="switchTab('ask')">自然语言问答</button>
            <button class="tab" onclick="switchTab('recommend')">智能推荐</button>
        </div>

        <div class="results" id="results">
            <div class="loading">请输入查询内容开始使用</div>
        </div>
    </div>

    <script>
        let currentTab = 'query';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function search() {
            const query = document.getElementById('search-input').value;
            if (!query) {
                alert('请输入查询内容');
                return;
            }

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading">查询中...</div>';

            try {
                let url, data;

                switch (currentTab) {
                    case 'query':
                        url = '/api/query';
                        data = { query };
                        break;
                    case 'search':
                        url = '/api/search';
                        data = { keyword: query, top_k: 10 };
                        break;
                    case 'ask':
                        url = '/api/ask';
                        data = { question: query };
                        break;
                    case 'recommend':
                        url = '/api/recommend';
                        data = { query, top_k: 5 };
                        break;
                }

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    displayResults(result);
                } else {
                    resultsDiv.innerHTML = `<div class="error">${result.error}</div>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">请求失败：${error.message}</div>`;
            }
        }

        function displayResults(result) {
            const resultsDiv = document.getElementById('results');
            let html = '';

            if (currentTab === 'query') {
                html += displayQueryResult(result);
            } else if (currentTab === 'search') {
                html += displaySearchResult(result);
            } else if (currentTab === 'ask') {
                html += displayAskResult(result);
            } else if (currentTab === 'recommend') {
                html += displayRecommendResult(result);
            }

            resultsDiv.innerHTML = html || '<div class="loading">无结果</div>';
        }

        function displayQueryResult(result) {
            let html = '';

            if (result.quota_matches && result.quota_matches.length > 0) {
                html += '<h3>📐 定额匹配</h3>';
                result.quota_matches.forEach(m => {
                    const q = m.data;
                    html += `
                        <div class="result-item">
                            <div class="result-title">${q.deh} - ${q.xmmc}</div>
                            <div class="result-content">
                                单位：${q.dw} | 单价：${q.dj}元 | 章节：${q.chapter}
                            </div>
                        </div>
                    `;
                });
            }

            if (result.explanations && result.explanations.length > 0) {
                html += '<h3>📖 解释推荐</h3>';
                result.explanations.forEach(e => {
                    html += `
                        <div class="result-item">
                            <div class="result-title">问：${e.question}</div>
                            <div class="result-content">答：${e.answer}</div>
                        </div>
                    `;
                });
            }

            return html;
        }

        function displaySearchResult(result) {
            let html = '';

            if (result.quota_matches && result.quota_matches.length > 0) {
                result.quota_matches.forEach(m => {
                    const q = m.data;
                    html += `
                        <div class="result-item">
                            <div class="result-title">${q.deh} - ${q.xmmc}</div>
                            <div class="result-content">
                                单位：${q.dw} | 单价：${q.dj}元 | 章节：${q.chapter} | 得分：${m.score}
                            </div>
                        </div>
                    `;
                });
            }

            return html;
        }

        function displayAskResult(result) {
            let html = '';

            if (result.qa_answer) {
                const qa = result.qa_answer;
                html += `
                    <div class="result-item">
                        <div class="result-title">问：${qa.question}</div>
                        <div class="result-content">答：${qa.answer}</div>
                        <div class="result-content">来源：${qa.source_file}</div>
                    </div>
                `;
            }

            return html;
        }

        function displayRecommendResult(result) {
            let html = '';

            if (result.quotas && result.quotas.length > 0) {
                html += '<h3>📐 推荐定额</h3>';
                result.quotas.forEach(q => {
                    html += `
                        <div class="result-item">
                            <div class="result-title">${q.code} - ${q.name}</div>
                            <div class="result-content">
                                单位：${q.unit} | 单价：${q.price}元
                            </div>
                        </div>
                    `;
                });
            }

            return html;
        }

        // 加载状态
        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();

                document.getElementById('stat-nodes').textContent = status.graph_stats?.nodes || '-';
                document.getElementById('stat-edges').textContent = status.graph_stats?.edges || '-';
                document.getElementById('stat-files').textContent = status.update_status?.trackedFiles || '-';
                document.getElementById('stat-generation').textContent = status.evolution_status?.generation || '-';
            } catch (error) {
                console.error('加载状态失败:', error);
            }
        }

        // 页面加载时获取状态
        loadStatus();
    </script>
</body>
</html>
