name: CCI RC Validation

on:
  pull_request:
    paths:
      - 'releases/v0.3.0-rc1/**'
      - '.github/workflows/cci-rc.yml'
  push:
    branches:
      - agent/webui-v0.3.0-rc1
    paths:
      - 'releases/v0.3.0-rc1/**'
      - '.github/workflows/cci-rc.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble release candidate
        run: |
          rm -rf .ci-rc
          mkdir -p .ci-rc
          unzip -q releases/v0.3.0-rc1/construction-cost-intelligence-v0.3.0-rc1-webui.zip -d .ci-rc
          if [ -d releases/v0.3.0-rc1/source ]; then
            cp -a releases/v0.3.0-rc1/source/. .ci-rc/
          fi
          rm -f .ci-rc/data/cost_intelligence.db

      - name: Install dependencies
        working-directory: .ci-rc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile
        working-directory: .ci-rc
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci-rc
        run: python -m compileall -q app tests

      - name: Test
        working-directory: .ci-rc
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci-rc
        run: pytest -q

      - name: Startup smoke test
        working-directory: .ci-rc
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci-rc
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          for path in ('/api/health', '/', '/docs'):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code)
          print('startup smoke test passed')
          PY
