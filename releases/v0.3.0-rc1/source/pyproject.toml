[project]
name = "construction-cost-intelligence"
version = "0.2.0.dev0"
description = "Local-first construction cost intelligence system for contractors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "typer>=0.12",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
cost-intel = "app.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
